# Runs as the image's unprivileged nginx user on a read-only filesystem: it listens on
# 8080/8443 (Compose publishes 80/443) and keeps its pid and temporary files in tmpfs.
pid /tmp/nginx.pid;
worker_processes auto;
worker_rlimit_nofile 65536;
error_log stderr error;
load_module modules/ngx_http_js_module.so;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Slow-client backstops: these, not connection counts, are what defeat slowloris.
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    large_client_header_buffers 4 16k;
    # The API's JSON and Stripe webhook limit (256 KiB); staff content uploads raise it.
    client_max_body_size 256k;
    client_body_buffer_size 256k;

    # Query strings and cookies are never logged: login and checkout flows, staff search
    # (?q=email) and referral codes would otherwise end up in log storage.
    map $uri $log_path {
        ~^/r/                  /r/:code;
        ~^/api/donor/referrals/ /api/donor/referrals/:code;
        ~^/donor/referrals/ /donor/referrals/:code;
        ~^/api/donor/me/sessions/ /api/donor/me/sessions/:id;
        ~^/donor/me/sessions/ /donor/me/sessions/:id;
        ~^/api/donor/me/receipts/ /api/donor/me/receipts/:id;
        ~^/donor/me/receipts/ /donor/me/receipts/:id;
        ~^/api/donor/company/ /api/donor/company/:code;
        ~^/donor/company/ /donor/company/:code;
        ~^/api/donor/oidc/ /api/donor/oidc/:provider;
        ~^/donor/oidc/ /donor/oidc/:provider;
        default                $uri;
    }
    log_format ingress escape=json
        '{"time":"$time_iso8601","client":"$remote_addr","host":"$host",'
        '"method":"$request_method","path":"$log_path","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,'
        '"upstream_duration":"$upstream_response_time","ray":"$http_cf_ray"}';
    access_log /dev/stdout ingress;

    # Per-client backstops behind the API's own limiter (auth 10, visitor 60, account 30,
    # staff 60 per minute). Each admits at least what the API does, so a legitimate client
    # meets the API's exact Retry-After first; floods stop here before reaching Node.
    js_import client from /etc/nginx/ingress/client-key.js;
    js_set $client_key client.key;
    limit_req_zone $client_key zone=auth:16m rate=20r/m;
    limit_req_zone $client_key zone=visitor:32m rate=120r/m;
    limit_req_zone $client_key zone=general:64m rate=30r/s;
    # Stripe delivers, and retries after an outage, from a few shared addresses.
    limit_req_zone $client_key zone=stripe:1m rate=20r/s;
    include /etc/nginx/ingress/native-routes.conf;
    map "$http_x_dad_client|$http_cookie|$http_origin" $native_request_valid {
        default 0;
        "native||" 1;
    }
    map $native_operation_class $native_method_allow { default ""; forbidden $native_allowed_methods; }
    map $native_operation_class $native_retry_after { default 5; auth 60; }
    map $native_operation_class $native_auth_key { default ""; auth $client_key; }
    map $native_operation_class $native_visitor_key { default ""; visitor $client_key; }
    limit_req_zone $native_auth_key zone=native_auth:16m rate=20r/m;
    limit_req_zone $native_visitor_key zone=native_visitor:32m rate=120r/m;
    limit_conn_zone $client_key zone=perip:32m;
    # Locations with their own zone replace the general one; the connection cap always applies.
    limit_req zone=general burst=300 nodelay;
    limit_conn perip 100;
    limit_req_status 429;
    limit_conn_status 429;
    # Rejections show as 429 in the access log; the error log would repeat the query string.
    limit_req_log_level warn;
    limit_conn_log_level warn;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # No OCSP stapling: Cloudflare Origin CA certificates have no responder and Let's
    # Encrypt no longer runs one.

    # Re-resolved at runtime because a redeploy gives the web container a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream web {
        zone web 64k;
        server web:3000 resolve;
        keepalive 32;
        # Below Node's 5 s keepAliveTimeout: a POST sent on a socket Node is closing fails
        # with 502, because nginx does not resend non-idempotent requests.
        keepalive_timeout 4s;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # The web proxy forwards X-Real-IP to the API as the rate-limit identity, so it is
    # always overwritten here and every other client-chosen address header is dropped.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";
    # Next.js internal header; CVE-2025-29927 used it to skip middleware.
    proxy_set_header X-Middleware-Subrequest "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    # Above the web proxy's 28 s API deadline and the API's 30 s write timeout.
    proxy_read_timeout 35s;
    proxy_buffer_size 16k;
    proxy_buffers 16 16k;
    # Buffer in memory only; anything larger streams at the client's pace.
    proxy_max_temp_file_size 0;
    # Next.js already compresses its responses.
    gzip off;

    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }
        location / {
            return 404;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
